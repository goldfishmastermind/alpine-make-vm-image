name: Build Minimal Alpine ARM64 UEFI

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install QEMU tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static qemu-utils

      - name: Download alpine-make-vm-image
        run: |
          wget https://raw.githubusercontent.com/alpinelinux/alpine-make-vm-image/master/alpine-make-vm-image
          chmod +x alpine-make-vm-image

      - name: Setup minimal config
        run: |
          # Stable repositories
          cat > repos <<EOF
          http://dl-cdn.alpinelinux.org/alpine/latest-stable/main
          http://dl-cdn.alpinelinux.org/alpine/latest-stable/community
          EOF

          # Configure script (sets root password + ensures serial console works)
          cat > configure.sh <<'EOF'
          #!/bin/sh
          # Set root password to "alpine" so you can log in via UTM
          echo "root:alpine" | chpasswd
          # Make sure serial console is enabled
          echo "ttyAMA0::respawn:/sbin/getty -L ttyAMA0 115200 vt100" >> /etc/inittab
          EOF
          chmod +x configure.sh

      - name: Build UEFI QCOW2 (base system only, no extra packages)
        run: |
          sudo ./alpine-make-vm-image \
            --arch aarch64 \
            --image-format qcow2 \
            --boot-mode UEFI \
            --repositories-file repos \
            --kernel-append "console=ttyAMA0" \
            --script-chroot \
            alpine-utm.qcow2 \
            ./configure.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: alpine-utm-uefi
          path: alpine-utm.qcow2
